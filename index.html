<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excelクエスト</title>
<meta name="description" content="Excel関数をゲーム感覚で学べる練習アプリ">
<meta name="theme-color" content="#1d6f42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Excelクエスト">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f4f7f5; --card: #ffffff; --ink: #1c2b22; --sub: #5d6f64; --line: #dbe3de;
  --green: #1d6f42; --green2: #2e9a5e; --greenbg: #e5f4ea; --yellow: #fff3b0; --red: #d64545; --redbg: #fde8e8;
  --gold: #f0b400; --head: #eef2ef; --shadow: 0 2px 8px rgba(0,0,0,.06); --on: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --card: #1b241f; --ink: #e8efe9; --sub: #9db0a4; --line: #2d3a33;
    --green: #3fbf74; --green2: #4fd284; --greenbg: #1d3527; --yellow: #4a4214; --red: #ff6b6b; --redbg: #3a1f1f;
    --head: #222d27; --shadow: none; --on: #0b1a11;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --card: #1b241f; --ink: #e8efe9; --sub: #9db0a4; --line: #2d3a33;
  --green: #3fbf74; --green2: #4fd284; --greenbg: #1d3527; --yellow: #4a4214; --red: #ff6b6b; --redbg: #3a1f1f;
  --head: #222d27; --shadow: none; --on: #0b1a11;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  font-size: 16px; line-height: 1.6;
  padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
}
#app { max-width: 560px; margin: 0 auto; padding: 0 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--head); padding: 1px 5px; border-radius: 5px; font-size: .92em; word-break: break-all; }

.top { display: flex; align-items: center; gap: 10px; padding: 12px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.brand { font-weight: 800; font-size: 20px; color: var(--green); flex: 1; }
.ttl { flex: 1; font-weight: 700; text-align: center; }
.pg { min-width: 40px; text-align: right; color: var(--sub); font-size: 14px; }
.icon { border: 0; background: none; font-size: 22px; width: 40px; height: 40px; border-radius: 10px; }
.prog { flex: 1; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog i, .bar i { display: block; height: 100%; background: var(--green2); border-radius: 99px; transition: width .4s; }

.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat { background: var(--card); border-radius: 14px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.stat .big { font-weight: 800; font-size: 20px; }
.stat .small, .small { font-size: 12px; color: var(--sub); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0; }

.cta { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 17px; background: var(--green); color: var(--on); margin-bottom: 8px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.cta.sub { background: var(--card); color: var(--green); border: 2px solid var(--green); box-shadow: none; }
.chap { font-size: 16px; margin: 20px 0 8px; color: var(--sub); }
.stages { display: flex; flex-direction: column; gap: 8px; }
.stage { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; }
.stage .num { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--greenbg); color: var(--green); font-weight: 800; display: grid; place-items: center; }
.stage.done .num { background: var(--green); color: var(--on); }
.stage .txt { flex: 1; display: flex; flex-direction: column; line-height: 1.3; }
.stage .txt small { color: var(--sub); font-size: 12px; }
.stage .st { color: var(--gold); letter-spacing: 1px; font-size: 14px; white-space: nowrap; }
.stage .st i, .bigstars i { color: var(--line); font-style: normal; }
.stage.locked { opacity: .5; }
.foot { font-size: 12px; color: var(--sub); text-align: center; margin-top: 24px; }

.card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 8px; font-size: 18px; color: var(--green); }
.card .body { font-size: 15px; }
.lesson .body { font-size: 16px; }
.qtag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--green); background: var(--greenbg); border-radius: 99px; padding: 2px 10px; margin-bottom: 8px; }
.qtext { font-size: 17px; margin-bottom: 10px; }

table.mini { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 6px; }
table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
table.mini th { background: var(--head); }

.gridwrap { overflow-x: auto; margin: 10px -4px 4px; padding: 0 4px; -webkit-overflow-scrolling: touch; }
table.grid { border-collapse: collapse; font-size: 13px; min-width: 100%; }
table.grid th { background: var(--head); color: var(--sub); font-weight: 600; font-size: 11px; padding: 2px 4px; border: 1px solid var(--line); min-width: 22px; }
table.grid td { border: 1px solid var(--line); padding: 5px 6px; min-width: 52px; white-space: nowrap; height: 32px; }
table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td.head { background: var(--head); font-weight: 700; }
table.grid td.hl { background: var(--yellow); }
table.grid td.hlred { background: var(--redbg); color: var(--red); font-weight: 700; }
table.grid td.target { outline: 3px solid var(--green2); outline-offset: -3px; background: var(--greenbg); font-weight: 800; color: var(--green); text-align: center; }
table.grid td.fillcell { background: var(--greenbg); color: var(--green); text-align: center; }
table.grid.tap td { cursor: pointer; }
table.grid td.flash { background: var(--green2); color: var(--on); }
.names { font-size: 13px; color: var(--sub); margin-top: 4px; }
.formula { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--head); border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; word-break: break-all; }
.formula span { font-style: italic; color: var(--sub); font-weight: 700; }
.formula b { color: var(--green); }

.row { display: flex; gap: 10px; margin: 12px 0; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 14px 10px; font-weight: 700; font-size: 16px; background: var(--green); color: var(--on); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
.btn.go { background: var(--green2); }
.btn.danger { background: var(--red); width: 100%; }
.btn:disabled { opacity: .45; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 14px; font-size: 16px; font-family: inherit; }
.opt.right { border-color: var(--green2); background: var(--greenbg); font-weight: 700; }
.opt.wrong { border-color: var(--red); background: var(--redbg); }
.opt:disabled { opacity: 1; }

.fxbar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--green2); border-radius: 12px; padding: 4px 10px; }
.fxbar span { font-style: italic; font-weight: 700; color: var(--sub); }
.fxbar input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 17px; padding: 8px 0; font-family: ui-monospace, Menlo, monospace; min-width: 0; }
.hint { font-size: 12px; color: var(--sub); margin: 6px 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 9px; min-width: 40px; height: 38px; padding: 0 9px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
.chip.fn { background: var(--greenbg); color: var(--green); font-weight: 700; border-color: transparent; }
.err { color: var(--red); font-size: 14px; min-height: 0; margin-top: 6px; }

.olist, .opool { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.olist { min-height: 48px; border: 2px dashed var(--line); border-radius: 14px; padding: 8px; }
.ochip { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.ochip.on { border-color: var(--green2); background: var(--greenbg); }
.ochip b { color: var(--green); margin-right: 4px; }

.fb { border-radius: 16px; padding: 14px; margin: 12px 0 24px; }
.fb.ok { background: var(--greenbg); }
.fb.ng { background: var(--redbg); }
.fbh { font-weight: 800; font-size: 19px; margin-bottom: 6px; }
.fb.ok .fbh { color: var(--green); }
.fb.ng .fbh { color: var(--red); }
.fb .ex { font-size: 15px; margin: 8px 0 12px; }
.fb .btn { width: 100%; }
.detail { font-size: 14px; }
.detail ol { margin: 4px 0; padding-left: 22px; }
table.cmp { border-collapse: collapse; width: 100%; margin: 4px 0 8px; font-size: 14px; }
table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 3px 6px; background: var(--card); }
table.cmp tr.n td { color: var(--red); }
.warn { background: var(--yellow); color: var(--ink); border-radius: 8px; padding: 6px 8px; margin: 6px 0; }

.finish { text-align: center; padding: 30px 0 10px; }
.medal { font-size: 72px; }
.finish h2 { margin: 6px 0; }
.bigstars { font-size: 40px; color: var(--gold); letter-spacing: 4px; }
.review { text-align: left; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.rv { background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 14px; border-left: 5px solid var(--green2); }
.rv.n { border-left-color: var(--red); }
.rv .ex { color: var(--sub); margin-top: 4px; }
.sw { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-weight: 700; }
.sw input { width: 22px; height: 22px; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.confetti span { position: absolute; top: -40px; animation: fall 2s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<noscript>JavaScript を有効にしてください．</noscript>
<script src="engine.js"></script>
<script src="stages.js"></script>
<script src="app.js"></script>
</body>
</html>
